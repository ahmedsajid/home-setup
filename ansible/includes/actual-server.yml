---

- name: Read ini config file
  ansible.builtin.import_playbook: "read_config_file.yml"

- name: "Actual Budget server setup"
  hosts: localhost
  connection: local
  vars:
    actual_docker_image: "docker.io/actualbudget/actual-server:26.7.0"
  tasks:
    - name: create actual required folder
      ansible.builtin.file:
        state: directory
        path: "{{ item }}"
      loop:
        - "/opt/actual"
        - "/mnt/nas/Backup/actual"

    - name: Deploy actual container
      community.docker.docker_container:
        name: "actual"
        hostname: "actual"
        image: "{{ actual_docker_image }}"
        env:
          TZ: 'America/Toronto'
        labels:
          traefik.enable: "true"
          traefik.docker.network: "app_network"
          traefik.http.routers.actual-server.rule: "Host(`money.{{ do_domain }}`)"
          traefik.http.routers.actual-server.entrypoints: "https"
          traefik.http.routers.actual-server.tls: "true"
          traefik.http.routers.actual-server.middlewares: "actual-server-iprestrict"
          traefik.http.middlewares.actual-server-iprestrict.ipallowlist.sourcerange: "{{ traefik_private_ipallowlist_sourcerange }}"
          traefik.http.middlewares.actual-server-iprestrict.ipallowlist.rejectstatuscode: "{{ traefik_ip_reject_status_code }}"
          traefik.http.services.actual-server.loadbalancer.server.port: "5006"
        networks:
          - name: "app_network"
        restart_policy: always
        state: started
        pull: false
        volumes:
          - '/opt/actual/data/:/data'
        network_mode: "bridge"
        container_default_behavior: "compatibility"
        comparisons:
          labels: strict
        memory: '500M'
      # added retry to tasks dependant on external services
      register: result
      retries: 5
      delay: 3
      until: result is succeeded
      when: not ansible_check_mode

    - name: Set today's actual backup path
      ansible.builtin.set_fact:
        actual_backup_file: "/mnt/nas/Backup/actual/actual-backup-{{ ansible_date_time.date }}.tgz"

    - name: Check whether today's actual backup already exists
      ansible.builtin.stat:
        path: "{{ actual_backup_file }}"
      register: actual_todays_backup

    - name: Run daily actual backup if missing
      block:
        - name: Create archive
          community.general.archive:
            path: /opt/actual
            dest: "{{ actual_backup_file }}"

        - name: Find older backups
          ansible.builtin.find:
            paths: /mnt/nas/Backup/actual/
            age: 5d
            recurse: true
          register: actual_old_backups

        - name: Remove older backups
          ansible.builtin.file:
            path: "{{ item.path }}"
            state: absent
          loop: "{{ actual_old_backups.files }}"
      when: (not actual_todays_backup.stat.exists) or
            (force_actual_backup is defined and force_actual_backup | bool)
